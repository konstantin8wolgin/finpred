[project]
name = "finpred"
version = "0.1.0"
description = "Realistic synthetic stock-chart generation + a discriminator that picks the real one out of N (era-split: train <= 2012-06-30, eval 2012-07-01..2019-12-31)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",          # GPU work is C++/CUDA under the hood; needs >=2.3 for torch.compile + BF16 on Ada (RTX 4070)
    "numpy>=1.26",
    "scipy>=1.11",         # Statistical functions (KS test, kurtosis)
    "polars>=1.0",         # Rust-backed dataframes for the data pipeline
    "pyarrow>=16.0",       # Parquet cache
    "yfinance>=0.2.40",    # Yahoo Finance daily OHLCV ingestion
    "mplfinance>=0.12.10b0",  # candlestick PNG renderer (human inspection only; model never sees pixels)
    "matplotlib>=3.8",
    "pydantic>=2.7",       # config schemas
    "pyyaml>=6.0",         # YAML config loading
    "tensorboard>=2.16",   # local experiment tracking (offline-friendly; no wandb in v1)
    "tqdm>=4.66",
    "typer>=0.12",         # quiz CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
finpred-ingest = "finpred.data.ingest:main"
finpred-train = "finpred.train.wgan_gp:main"
finpred-eval = "finpred.eval.n_way:main"
finpred-quiz = "finpred.quiz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
